          <button id="btn-new"></button>
          <div class="row">

        <p class="fine" id="title-save"></p>
        <div class="notice" id="title-broken" hidden>
          <p id="title-broken-msg"></p>
          <button id="btn-save-retry"></button>

      </div>

    <!-- 오류 복구 -->

    </section>

      <div class="compass" id="compass" hidden><div class="comp-strip" id="comp-strip"></div></div>
      <div class="dodge-cue" id="dodge-cue" hidden></div>
      <div class="cluster" id="cluster" hidden><span class="cl-n" id="cluster-n"></span><span class="cl-bar"><i id="cluster-fill"></i></span></div>
      <div class="train" id="train" role="status" hidden><span class="tr-title" id="train-title"></span><span class="tr-step" id="train-step"></span><button class="tr-skip" id="train-skip"></button></div>

        <button class="prompt" id="prompt" hidden></button>
        <div class="burst" id="burst"><div class="bar" id="burst-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="burst-fill"></i></div><span id="burst-label"></span></div>

    <!-- 일시정지 -->

        <div class="col">
          <button id="btn-resume" class="primary" data-hot="Esc"></button>
          <button id="btn-save" data-hot="S"></button>

        <div class="row"><button id="btn-results-retry" class="primary"></button><button id="btn-results-title"></button></div>
